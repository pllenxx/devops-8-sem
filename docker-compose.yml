version: '3.8'

services:
  database:
    container_name: mypostgres
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    # volumes:
      # - django_data_volumeq:/var/lib/postgresql/data

    ports:
      - "5432:5432"

  rest_api:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: mydjangorestapi
    ports:
      - "8000:8000"
    depends_on:
      - database

  web_front:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: mydjangowebfront
    command: ./npm-install-and-start.sh
    volumes:
      - ./code/django_web_front:/code
    ports:
      - "3001:3000"
    depends_on:
      - rest_api

volumes:
  django_data_volume: